solution:
  created-for: CMSIS-Toolbox@2.15.0
  packs:
    - pack: ARM::V2M_MPS3_SSE_300_BSP@1.5.0
    - pack: AlifSemiconductor::Ensemble@2.2.1
    - pack: ARM::CMSIS@6.3.0
    - pack: ARM::CMSIS-RTX@5.9.1
  target-types:
    - type: Corstone300-GCC
      compiler: GCC@14.3.1
      board: ARM::V2M-MPS3-SSE-300-FVP
      device: ARM::SSE-300-MPS3
      target-set:
        - set: minimal
          images:
            - project-context: LeanEmbedded.Debug
            - project-context: LeanSmokeLib.Debug
              load: none
          debugger:
            name: Arm-FVP
            model: ${workspaceFolder}/scripts/fvp-model.py
            config-file: board/Corstone300/fvp.cfg
        - set: console
          images:
            - project-context: LeanEmbedded.Console
            - project-context: LeanSmokeLib.Console
              load: none
          debugger:
            name: Arm-FVP
            model: ${workspaceFolder}/scripts/fvp-model.py
            config-file: board/Corstone300/fvp.cfg
      variables:
        - Board-Layer: $SolutionDir()$/board/Corstone300/Board.clayer.yml
    - type: Corstone300-CLANG
      compiler: CLANG@23.1.0
      board: ARM::V2M-MPS3-SSE-300-FVP
      device: ARM::SSE-300-MPS3
      target-set:
        - set: minimal
          images:
            - project-context: LeanEmbedded.Debug
            - project-context: LeanSmokeLib.Debug
              load: none
          debugger:
            name: Arm-FVP
            model: ${workspaceFolder}/scripts/fvp-model.py
            config-file: board/Corstone300/fvp.cfg
        - set: console
          images:
            - project-context: LeanEmbedded.Console
            - project-context: LeanSmokeLib.Console
              load: none
          debugger:
            name: Arm-FVP
            model: ${workspaceFolder}/scripts/fvp-model.py
            config-file: board/Corstone300/fvp.cfg
      variables:
        - Board-Layer: $SolutionDir()$/board/Corstone300/Board.clayer.yml
    - type: DevKit-E8
      compiler: GCC@14.3.1
      board: Alif Semiconductor::DevKit-E8
      device: Alif Semiconductor::AE822FA0E5597LS0:M55_HP
      variables:
        - Board-Layer: $SolutionDir()$/board/DevKit-E8/Board.clayer.yml
      target-set:
        - set: minimal
          images:
            - project-context: LeanEmbedded.Debug
            - project-context: LeanSmokeLib.Debug
              load: none
          debugger:
            name: ULINKplus@pyOCD
            clock: 10000000
            protocol: swd
        - set: console
          images:
            - project-context: LeanEmbedded.Console
            - project-context: LeanSmokeLib.Console
              load: none
          debugger:
            name: ULINKplus@pyOCD
            clock: 10000000
            protocol: swd
        - set: blinky
          images:
            - project-context: LeanBlinky.Debug
            - project-context: LeanBlinkyLib.Debug
              load: none
          debugger:
            name: ULINKplus@pyOCD
            clock: 10000000
            protocol: swd
  build-types:
    - type: Debug
      debug: 'on'
    - type: Console
      debug: 'on'
  projects:
    # Keep cprojects before native CMake entries: Toolbox 2.15 otherwise carries
    # the native build target into subsequent cproject builds.
    - project: examples/smoke/LeanEmbedded.cproject.yml
    - project: examples/blinky/LeanBlinky.cproject.yml
      for-context: .Debug+DevKit-E8
    - cmake:
        project-id: LeanSmokeLib
        source: .
        configure:
          - -DLEAN_PROFILE=Debug
          - -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi.cmake
          - -DCMSIS_RTOS_INCLUDE=$ENV{CMSIS_PACK_ROOT}/ARM/CMSIS/6.3.0/CMSIS/RTOS2/Include
        images:
          - image: liblean.a
            type: lib
      for-context: .Debug+Corstone300-GCC
    - cmake:
        project-id: LeanSmokeLib
        source: .
        configure:
          - -DLEAN_PROFILE=Console
          - -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi.cmake
          - -DCMSIS_RTOS_INCLUDE=$ENV{CMSIS_PACK_ROOT}/ARM/CMSIS/6.3.0/CMSIS/RTOS2/Include
        images:
          - image: liblean.a
            type: lib
      for-context: .Console+Corstone300-GCC
    - cmake:
        project-id: LeanSmokeLib
        source: .
        configure:
          - -DLEAN_PROFILE=Debug
          - -DCMAKE_TOOLCHAIN_FILE=cmake/clang.cmake
          - -DCMSIS_RTOS_INCLUDE=$ENV{CMSIS_PACK_ROOT}/ARM/CMSIS/6.3.0/CMSIS/RTOS2/Include
        images:
          - image: liblean.a
            type: lib
      for-context: .Debug+Corstone300-CLANG
    - cmake:
        project-id: LeanSmokeLib
        source: .
        configure:
          - -DLEAN_PROFILE=Console
          - -DCMAKE_TOOLCHAIN_FILE=cmake/clang.cmake
          - -DCMSIS_RTOS_INCLUDE=$ENV{CMSIS_PACK_ROOT}/ARM/CMSIS/6.3.0/CMSIS/RTOS2/Include
        images:
          - image: liblean.a
            type: lib
      for-context: .Console+Corstone300-CLANG
    - cmake:
        project-id: LeanSmokeLib
        source: .
        device: :M55_HP
        configure:
          - -DLEAN_PROFILE=Debug
          - -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi.cmake
          - -DCMSIS_RTOS_INCLUDE=$ENV{CMSIS_PACK_ROOT}/ARM/CMSIS/6.3.0/CMSIS/RTOS2/Include
        images:
          - image: liblean.a
            type: lib
      for-context: .Debug+DevKit-E8
    - cmake:
        project-id: LeanSmokeLib
        source: .
        device: :M55_HP
        configure:
          - -DLEAN_PROFILE=Console
          - -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi.cmake
          - -DCMSIS_RTOS_INCLUDE=$ENV{CMSIS_PACK_ROOT}/ARM/CMSIS/6.3.0/CMSIS/RTOS2/Include
        images:
          - image: liblean.a
            type: lib
      for-context: .Console+DevKit-E8
    - cmake:
        project-id: LeanBlinkyLib
        source: .
        device: :M55_HP
        configure:
          - -DLEAN_PROFILE=Debug
          - -DLEAN_APP=Blinky
          - -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi.cmake
          - -DCMSIS_RTOS_INCLUDE=$ENV{CMSIS_PACK_ROOT}/ARM/CMSIS/6.3.0/CMSIS/RTOS2/Include
        images:
          - image: liblean.a
            type: lib
      for-context: .Debug+DevKit-E8
  output-dirs:
    outdir: $SolutionDir()$/out/$Project$/$TargetType$/$BuildType$
