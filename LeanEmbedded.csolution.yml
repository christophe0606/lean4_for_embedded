solution:
  created-for: CMSIS-Toolbox@2.15.0
  packs:
    - pack: ARM::V2M_MPS3_SSE_300_BSP@1.4.0
    - pack: ARM::CMSIS@6.3.0
    - pack: ARM::CMSIS-RTX@5.9.1
  target-types:
    - type: Corstone300-GCC
      compiler: GCC@14.3.1
      board: ARM::V2M-MPS3-SSE-300-FVP
      device: ARM::SSE-300-MPS3
      target-set:
        - set: minimal
          images:
            - project-context: LeanEmbedded.Debug
          debugger:
            name: Arm-FVP
            model: ${workspaceFolder}/scripts/fvp-model.py
            config-file: board/Corstone300/fvp.cfg
        - set: console
          images:
            - project-context: LeanEmbedded.Console
          debugger:
            name: Arm-FVP
            model: ${workspaceFolder}/scripts/fvp-model.py
            config-file: board/Corstone300/fvp.cfg
    - type: Corstone300-CLANG
      compiler: CLANG@23.1.0
      board: ARM::V2M-MPS3-SSE-300-FVP
      device: ARM::SSE-300-MPS3
      target-set:
        - set: minimal
          images:
            - project-context: LeanEmbedded.Debug
          debugger:
            name: Arm-FVP
            model: ${workspaceFolder}/scripts/fvp-model.py
            config-file: board/Corstone300/fvp.cfg
        - set: console
          images:
            - project-context: LeanEmbedded.Console
          debugger:
            name: Arm-FVP
            model: ${workspaceFolder}/scripts/fvp-model.py
            config-file: board/Corstone300/fvp.cfg
  build-types:
    - type: Debug
      debug: on
    - type: Console
      debug: on
  projects:
    - cmake:
        project-id: LeanEmbedded
        source: .
        configure:
          - -DLEAN_PROFILE=Debug
          - -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi.cmake
        images:
          - image: lean-smoke.elf
            type: elf
      for-context: .Debug+Corstone300-GCC
    - cmake:
        project-id: LeanEmbedded
        source: .
        configure:
          - -DLEAN_PROFILE=Console
          - -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi.cmake
        images:
          - image: lean-smoke.elf
            type: elf
      for-context: .Console+Corstone300-GCC
    - cmake:
        project-id: LeanEmbedded
        source: .
        configure:
          - -DLEAN_PROFILE=Debug
          - -DCMAKE_TOOLCHAIN_FILE=cmake/clang.cmake
        images:
          - image: lean-smoke.elf
            type: elf
      for-context: .Debug+Corstone300-CLANG
    - cmake:
        project-id: LeanEmbedded
        source: .
        configure:
          - -DLEAN_PROFILE=Console
          - -DCMAKE_TOOLCHAIN_FILE=cmake/clang.cmake
        images:
          - image: lean-smoke.elf
            type: elf
      for-context: .Console+Corstone300-CLANG
