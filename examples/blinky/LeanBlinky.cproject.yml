project:
  description: Lean RGB Blinky on DevKit-E8 M55_HP
  output:
    base-name: lean-blinky
    type: [elf, map]
  layers:
    - layer: $Board-Layer$
    - layer: ../../runtime/Lean.clayer.yml
    - layer: ../../api/Core.clayer.yml
    - layer: ../../api/GPIO.clayer.yml
    - layer: ../../api/Alif.clayer.yml
    - layer: ../../api/USART.clayer.yml
  add-path:
    - ../../api/c
    - $OutDir(LeanBlinkyLib)$/generated
    - $OutDir(LeanBlinkyLib)$/upstream/include
    - $OutDir(LeanBlinkyLib)$/upstream
  groups:
    - group: Application
      files:
        - file: main.c
        - file: platform.c
    - group: Lean library
      files:
        - file: $lib(LeanBlinkyLib)$
